name: HTTP E2E and live explorer

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  http-e2e:
    name: HTTP payment flow / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "5.6"
          - "7.4"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none

      - name: Run full HTTP payment flow
        run: bash .github/tests/http-e2e.sh

  live-explorer:
    name: Live production explorer contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: openssl
          coverage: none

      - name: Query production explorer through grlcpay
        shell: bash
        run: |
          cat > /tmp/live-explorers.php <<'PHP'
          <?php
          $_GET = array();
          $_POST = array();
          $_REQUEST = array();
          $_SERVER['REQUEST_METHOD'] = 'GET';

          ob_start();
          require getcwd() . '/index.php';
          ob_end_clean();

          $address = 'MDd48J6uMYqVSLS1bpgfFtesf5z7cR5wnD';
          $explorers = explorers_get($address);

          echo json_encode($explorers, JSON_PRETTY_PRINT), "\n";

          if (!isset($explorers[0]['balance']) || !is_numeric($explorers[0]['balance'])) {
              fwrite(STDERR, "Production explorer did not return a numeric balance\n");
              exit(1);
          }

          echo "Production explorer balance: ", $explorers[0]['balance'], "\n";
          echo "LIVE EXPLORER OK\n";
          PHP

          php /tmp/live-explorers.php


